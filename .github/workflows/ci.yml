name: CI

on: [push, pull_request]

jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      DEBUGPEDIA_DIR: ${{ runner.temp }}/ledger
    steps:
      - uses: actions/checkout@v4

      - name: install.sh
        run: sh install.sh

      - name: tests/smoke.sh
        run: sh tests/smoke.sh

      - name: redteam/run.sh
        run: sh redteam/run.sh