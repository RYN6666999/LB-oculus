name: CI
on: push
jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: sh install.sh
        env:
          DEBUGPEDIA_DIR: ${{ runner.temp }}/ledger
      - name: smoke
        run: sh tests/smoke.sh
        env:
          DEBUGPEDIA_DIR: ${{ runner.temp }}/ledger
      - name: redteam
        run: sh redteam/run.sh
        env:
          DEBUGPEDIA_DIR: ${{ runner.temp }}/ledger
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: sh install.sh
        env:
          DEBUGPEDIA_DIR: ${{ runner.temp }}/ledger
      - name: smoke
        run: sh tests/smoke.sh
        env:
          DEBUGPEDIA_DIR: ${{ runner.temp }}/ledger
      - name: redteam
        run: sh redteam/run.sh
        env:
          DEBUGPEDIA_DIR: ${{ runner.temp }}/ledger